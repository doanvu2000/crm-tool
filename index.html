<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SKU Analysis</title>
    <meta name="description" content="Phân tích SKU theo ABC, tốc độ bán, tồn kho, OOS, xu hướng và đề xuất Action." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('sku-theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Code:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="min-h-dvh">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
